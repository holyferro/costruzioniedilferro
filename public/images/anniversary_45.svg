<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b6a10"/>
      <stop offset="35%" stop-color="#d5aa38"/>
      <stop offset="55%" stop-color="#fff1a8"/>
      <stop offset="75%" stop-color="#bd8720"/>
      <stop offset="100%" stop-color="#7d560b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="8" stdDeviation="3" flood-color="#172b65" flood-opacity="0.35"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="2" flood-color="#172b65" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- white rounded square background -->
  <rect x="90" y="70" width="820" height="860" rx="55" fill="#ffffff"/>

  <!-- ANNIVERSARY -->
  <text x="500" y="195"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="400"
        letter-spacing="3"
        fill="#ffffff"
        stroke="#283d83"
        stroke-width="4"
        filter="url(#textShadow)">ANNIVERSARY</text>

  <!-- large 45: gold outline layer -->
  <text x="500" y="640"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="455"
        font-weight="700"
        fill="#283d83"
        stroke="url(#gold)"
        stroke-width="38"
        paint-order="stroke fill"
        filter="url(#softShadow)">45</text>

  <!-- degree symbol -->
  <text x="765" y="385"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="150"
        font-weight="700"
        fill="#283d83"
        stroke="url(#gold)"
        stroke-width="19"
        paint-order="stroke fill"
        filter="url(#softShadow)">°</text>

  <!-- inner light highlight for 45 -->
  <text x="500" y="640"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="455"
        font-weight="700"
        fill="none"
        stroke="#ffffff"
        stroke-width="10"
        stroke-opacity="0.35">45</text>

  <!-- subtitle -->
  <text x="500" y="830"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="400"
        letter-spacing="2"
        fill="#ffffff"
        stroke="#283d83"
        stroke-width="2.5"
        paint-order="stroke fill"
        filter="url(#textShadow)">1981 | 2026</text>
</svg>
